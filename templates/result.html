<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Customer Segmentation Results</title>
    <link rel="stylesheet" href="{{ url_for('static', path='css/style.css')}}?v=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.1/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .result-container {
            margin-top: 100px;
            text-align: center;
            animation: fadeIn 1s ease-in;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="glass-container result-container">
                    <h4 style="color: #bbb; text-transform: uppercase;">Analysis Complete</h4>
                    <h2 style="color: white;">YOU ARE A...</h2>
                    <h1 class="category-name">{{ category }}</h1>

                    <div class="mt-5 p-4" style="background: rgba(0,0,0,0.2); border-radius: 15px;">
                        <p style="font-size: 1.1rem; line-height: 1.6; color: #ddd;">
                            Our advanced intelligence model has categorized your profile based on spending power,
                            loyalty, and demographic data.
                            This segment represents high-value growth potential for data-driven strategic engagement.
                        </p>
                    </div>

                    <a href="/" class="back-link">← Analyze Another Customer</a>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
