<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Customer Segmentation</title>
    <link rel="stylesheet" href="{{ url_for('static', path='css/style.css')}}?v=1.6">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.1/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
    <nav class="navbar fixed-top">
        <div class="container d-flex justify-content-between align-items-center">
            <a href="/" class="text-decoration-none"><span class="navbar-brand fw-bold">CUSTOMER CATEGORIZER</span></a>
            <div class="nav-links">
                <a href="/" class="btn btn-light btn-sm px-3 me-2">Predict</a>
                <a href="/dashboard" class="btn btn-outline-light btn-sm px-3 me-2">Dashboard</a>
                <a href="/predict_batch" class="btn btn-outline-light btn-sm px-3">Batch</a>
            </div>
        </div>
    </nav>

    <section class="main-section">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-lg-8 col-md-10">
                    <div class="glass-container">
                        <form action="/" method="post">
                            <legend>Customer Segmentation</legend>

                            <div class="row g-3">
                                <!-- Demographic Information -->
                                <div class="col-md-6 mb-3">
                                    <label class="form-label" for="Age">Age</label>
                                    <input type="number" class="form-control" id="Age" name="Age" placeholder="e.g. 35"
                                        required>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="form-label" for="Education">Education Level</label>
                                    <select class="form-control" id="Education" name="Education" required>
                                        <option value="" disabled selected>Select Education</option>
                                        <option value="0">Basic</option>
                                        <option value="1">2n Cycle</option>
                                        <option value="2">Graduation</option>
                                        <option value="3">Master</option>
                                        <option value="4">PhD</option>
                                    </select>
                                </div>

                                <div class="col-md-6 mb-3">
                                    <label class="form-label" for="Marital_Status">Married Status</label>
                                    <select class="form-control" id="Marital_Status" name="Marital_Status" required>
                                        <option value="" disabled selected>Select:</option>
                                        <option value="0">No</option>
                                        <option value="1">Yes</option>
                                    </select>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="form-label" for="Parental_Status">Has Dependents/Kids</label>
                                    <select class="form-control" id="Parental_Status" name="Parental_Status" required>
                                        <option value="" disabled selected>Select:</option>
                                        <option value="0">No</option>
                                        <option value="1">Yes</option>
                                    </select>
                                </div>

                                <div class="col-md-6 mb-3">
                                    <label class="form-label" for="Children">Total Number of Children</label>
                                    <input type="number" class="form-control" id="Children" name="Children"
                                        placeholder="0" required>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="form-label" for="Income">Annual Household Income ($)</label>
                                    <input type="number" class="form-control" id="Income" name="Income"
                                        placeholder="e.g. 50000" required>
                                </div>

                                <!-- Behavior Information -->
                                <div class="col-12 mb-3">
                                    <hr style="border-color: var(--border-accent)">
                                    <h5 class="text-center mb-4" style="color: var(--accent-primary)">Spending & Loyalty
                                        Habits</h5>
                                </div>

                                <div class="col-md-6 mb-3">
                                    <label class="form-label" for="Total_Spending">Lifetime Total Spending</label>
                                    <input type="number" class="form-control" id="Total_Spending" name="Total_Spending"
                                        placeholder="Total spending amount" required>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="form-label" for="Days_as_Customer">Customer Tenure (Days)</label>
                                    <input type="number" class="form-control" id="Days_as_Customer"
                                        name="Days_as_Customer" placeholder="Days active" required>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="form-label" for="Recency">Days Since Last Purchase</label>
                                    <input type="number" class="form-control" id="Recency" name="Recency"
                                        placeholder="Recency period" required>
                                </div>

                                <!-- Detailed Expenditures -->
                                <div class="col-md-6 mb-3">
                                    <label class="form-label" for="Wines">Spent on Wines ($)</label>
                                    <input type="number" class="form-control" id="Wines" name="Wines"
                                        placeholder="In last 2 years" required>
                                </div>
                                <div class="col-md-4 mb-3">
                                    <label class="form-label" for="Fruits">Fruits ($)</label>
                                    <input type="number" class="form-control" id="Fruits" name="Fruits" required>
                                </div>
                                <div class="col-md-4 mb-3">
                                    <label class="form-label" for="Meat">Meat ($)</label>
                                    <input type="number" class="form-control" id="Meat" name="Meat" required>
                                </div>
                                <div class="col-md-4 mb-3">
                                    <label class="form-label" for="Fish">Fish ($)</label>
                                    <input type="number" step="0.01" class="form-control" id="Fish" name="Fish"
                                        required>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="form-label" for="Sweets">Sweets ($)</label>
                                    <input type="number" class="form-control" id="Sweets" name="Sweets" required>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="form-label" for="Gold">Luxury/Gold Items ($)</label>
                                    <input type="number" class="form-control" id="Gold" name="Gold" required>
                                </div>

                                <!-- Channels -->
                                <div class="col-md-4 mb-3">
                                    <label class="form-label" for="Web">Web Orders</label>
                                    <input type="number" class="form-control" id="Web" name="Web" required>
                                </div>
                                <div class="col-md-4 mb-3">
                                    <label class="form-label" for="Catalog">Catalog Orders</label>
                                    <input type="number" class="form-control" id="Catalog" name="Catalog" required>
                                </div>
                                <div class="col-md-4 mb-3">
                                    <label class="form-label" for="Store">Store Purchases</label>
                                    <input type="number" class="form-control" id="Store" name="Store" required>
                                </div>

                                <!-- Offers -->
                                <div class="col-md-6 mb-3">
                                    <label class="form-label" for="Discount_Purchases">Discount Deals Taken</label>
                                    <input type="number" class="form-control" id="Discount_Purchases"
                                        name="Discount_Purchases" required>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="form-label" for="Total_Promo">Promo Offers Accepted</label>
                                    <input type="number" class="form-control" id="Total_Promo" name="Total_Promo"
                                        required>
                                </div>
                                <div class="col-12 mb-3">
                                    <label class="form-label" for="NumWebVisitsMonth">Monthly Website Visits</label>
                                    <input type="number" class="form-control" id="NumWebVisitsMonth"
                                        name="NumWebVisitsMonth" required>
                                </div>
                            </div>

                            <button class="btn-predict" type="submit">Unlock Customer Insights</button>
                        </form>

                        {% if context is not none %}
                        <div class="result-box text-center">
                            <span class="cluster-text">Result Profile: Cluster {{context}}</span>
                        </div>
                        {% endif %}
                    </div>
                </div>
            </div>
        </div>
    </section>
</body>

</html>
